<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>گزارش ناشر · ناشر من</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #FED049;
      --ink: #1c1917;
      --bg: #fafaf9;
      --card: #ffffff;
      --border: #e7e5e4;
      --text: #1c1917;
      --muted: #78716c;
      --subtle: #f5f5f4;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0c0a09; --card:#1c1917; --border:#292524; --text:#fafaf9; --muted:#a8a29e; --subtle:#231f1d; }
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Vazirmatn',Tahoma,sans-serif; background:var(--bg); color:var(--text); direction:rtl; min-height:100vh; }
    .hdr { background:#1c1917; color:#fff; padding:0 32px; height:64px; display:flex; align-items:center; justify-content:space-between; gap:16px; position:sticky; top:0; z-index:200; }
    .hdr-brand { display:flex; align-items:center; gap:12px; }
    .y-logo { width:34px; height:34px; background:var(--accent); color:#1c1917; border-radius:8px; font-size:17px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .hdr-name { font-size:15px; font-weight:600; }
    .hdr-meta { font-size:11px; color:#a8a29e; margin-top:2px; }
    .rpm-pill { background:var(--accent); color:#1c1917; padding:8px 16px; border-radius:10px; display:flex; align-items:baseline; gap:5px; flex-shrink:0; }
    .rpm-pill-val { font-size:22px; font-weight:700; }
    .rpm-pill-lbl { font-size:10px; font-weight:500; opacity:.7; }
    .main { padding:28px 24px 64px; }
    .sec-lbl { font-size:14px; font-weight:700; letter-spacing:.04em; color:var(--text); margin-bottom:16px; margin-top:8px; display:flex; align-items:center; gap:8px; }
    .sec-lbl::before { content:''; display:block; width:3px; height:14px; background:var(--accent); border-radius:2px; }
    .stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:36px; }
    .stat-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px 20px; }
    .stat-card-lbl { font-size:11px; color:var(--muted); margin-bottom:6px; }
    .stat-card-val { font-size:26px; font-weight:700; line-height:1; }
    .stat-card-unit { font-size:11px; color:var(--muted); margin-top:5px; }
    .chart-section { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:22px 24px 18px; margin-bottom:28px; }
    .chart-empty { padding:32px; text-align:center; color:var(--muted); font-size:13px; background:var(--subtle); border-radius:8px; }
    .outlook-row { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:36px; }
    .outlook-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; text-align:center; position:relative; }
    .outlook-card.realistic { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
    .outlook-badge { position:absolute; top:12px; left:12px; font-size:10px; font-weight:600; background:var(--subtle); color:var(--muted); padding:3px 8px; border-radius:4px; }
    .outlook-card.realistic .outlook-badge { background:var(--accent); color:#1c1917; }
    .outlook-icon { font-size:30px; margin-bottom:6px; margin-top:6px; }
    .outlook-title { font-size:13px; font-weight:600; color:var(--muted); margin-bottom:18px; }
    .outlook-rpm { font-size:34px; font-weight:700; color:var(--accent); line-height:1; margin-bottom:4px; }
    .outlook-rpm-lbl { font-size:10px; color:var(--muted); margin-bottom:14px; }
    .outlook-divider { height:1px; background:var(--border); margin:14px 0; }
    .outlook-revenue { font-size:19px; font-weight:600; }
    .outlook-revenue-lbl { font-size:10px; color:var(--muted); margin-top:4px; }
    .pos-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:12px; }
    details.pos-card { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; transition:border-color .15s; }
    details.pos-card[open] { border-color:var(--accent); }
    summary.pos-summary { padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer; list-style:none; user-select:none; }
    summary.pos-summary::-webkit-details-marker { display:none; }
    .pos-icon { width:38px; height:38px; flex-shrink:0; background:var(--subtle); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--muted); }
    .pos-info { flex:1; min-width:0; }
    .pos-name { font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-bottom:2px; }
    .pos-sub { font-size:10px; color:var(--muted); }
    .pos-spark { width:72px; height:26px; flex-shrink:0; }
    .pos-rpm-col { text-align:left; flex-shrink:0; min-width:56px; }
    .pos-rpm-val { font-size:18px; font-weight:700; color:var(--accent); line-height:1; }
    .pos-rpm-unit { font-size:9px; color:var(--muted); }
    .pos-expand { padding:4px 16px 14px; border-top:1px solid var(--border); }
    .pos-expand-lbl { font-size:10px; font-weight:600; color:var(--muted); margin:10px 0 8px; letter-spacing:.04em; }
    .pos-no-data { opacity:.5; }
    .pos-no-data summary { cursor:default; }
    #loading { height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--muted); }
    .ld-logo { width:50px; height:50px; background:var(--accent); color:#1c1917; border-radius:13px; font-size:25px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-bottom:4px; }
    #loading p { font-size:14px; }
    .filter-bar { background:var(--card); border-bottom:1px solid var(--border); padding:10px 24px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; position:sticky; top:64px; z-index:100; }
    /* tab-bar styles kept for reference but no longer used */
    .filter-group { display:flex; align-items:center; gap:6px; }
    .filter-lbl { font-size:11px; color:var(--muted); white-space:nowrap; }
    .filter-sel { font-family:inherit; font-size:12px; background:var(--subtle); border:1px solid var(--border); border-radius:6px; padding:5px 8px; color:var(--text); direction:rtl; cursor:pointer; }
    .filter-btn { font-family:inherit; font-size:12px; font-weight:600; background:var(--accent); color:#1c1917; border:none; border-radius:6px; padding:6px 14px; cursor:pointer; white-space:nowrap; }
    .filter-btn:hover { opacity:.85; }
    .toggle-group { display:flex; border:1px solid var(--border); border-radius:7px; overflow:hidden; margin-right:auto; }
    .toggle-btn { font-family:inherit; font-size:11px; font-weight:600; background:none; border:none; padding:5px 12px; cursor:pointer; color:var(--muted); transition:background .15s,color .15s; }
    .toggle-btn.active { background:var(--accent); color:#1c1917; }
    .filter-sep { flex:1; min-width:8px; }
    .filter-divider { width:1px; background:var(--border); align-self:stretch; margin:0 4px; }
    .filter-pos-grp { align-items:flex-start !important; flex-direction:column; gap:4px !important; }
    .sel-sm { font-family:inherit; font-size:11px; background:var(--subtle); border:1px solid var(--border); border-radius:6px; padding:4px 6px; color:var(--text); direction:rtl; cursor:pointer; }
    .pos-filter-sel { font-family:inherit; font-size:12px; background:var(--subtle); border:1px solid var(--border); border-radius:6px; padding:2px 4px; color:var(--text); direction:rtl; width:160px; }
    .chart-section { overflow:visible; }
    .charts-duo { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:28px; }
    .charts-duo .chart-section { margin-bottom:0; }
    /* tooltip */
    .chart-tt { position:absolute; top:6px; background:var(--ink,#1c1917); color:#fff; font-size:11px; padding:4px 9px; border-radius:6px; pointer-events:none; white-space:nowrap; display:flex; gap:6px; align-items:center; z-index:10; transform:translateX(-50%); }
    .tt-label { opacity:.7; }
    .tt-val { font-weight:600; }
    /* position table */
    .pos-table { width:100%; border-collapse:collapse; font-size:13px; background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:36px; }
    .pos-table th { padding:10px 14px; text-align:right; font-size:11px; font-weight:700; color:var(--muted); letter-spacing:.04em; border-bottom:2px solid var(--border); white-space:nowrap; background:var(--subtle); }
    .pos-table td { padding:10px 14px; border-bottom:1px solid var(--border); vertical-align:middle; }
    .pos-table tbody tr:last-child td { border-bottom:none; }
    .pos-table .tnum { text-align:left; direction:ltr; }
    .ptr-above td { font-weight:600; }
    .ptr-below td { opacity:0.72; font-weight:400; }
    .ptr-nodata td { opacity:0.35; }
    .ptr-rpm { color:var(--accent) !important; font-weight:700 !important; }
    .ptr-share,.ptr-cumul { font-size:12px; color:var(--muted); }
    .ptr-id { font-size:11px; color:var(--muted); }
    .ptr-rank { font-size:12px; color:var(--muted); }
    .ptr-total { background:var(--subtle); font-weight:600; }
    .ptr-shot-row td { padding:0 14px 12px; }
    .ptr-shot-img { max-width:100%; border-radius:8px; display:block; }
    /* position search widget */
    .pos-sw { position:relative; display:flex; flex-wrap:wrap; align-items:center; gap:4px; background:rgba(254,208,73,0.08); border:1.5px solid rgba(254,208,73,0.55); border-radius:8px; padding:4px 8px; min-width:180px; max-width:320px; cursor:text; transition:border-color .15s,box-shadow .15s; }
    .pos-sw:focus-within { border-color:var(--accent); box-shadow:0 0 0 2px rgba(254,208,73,0.2); }
    .pos-tags { display:flex; flex-wrap:wrap; gap:3px; }
    .pos-tag { display:inline-flex; align-items:center; gap:3px; background:var(--accent); color:#1c1917; border-radius:4px; padding:2px 6px; font-size:11px; font-weight:600; white-space:nowrap; }
    .pos-tag-x { background:none; border:none; cursor:pointer; font-size:13px; line-height:1; padding:0; color:inherit; opacity:.7; }
    .pos-tag-x:hover { opacity:1; }
    .pos-inp { font-family:inherit; font-size:12px; background:none; border:none; outline:none; color:var(--text); direction:rtl; min-width:80px; flex:1; padding:2px 0; }
    .pos-inp::placeholder { color:var(--muted); }
    .pos-dd { display:none; position:absolute; top:calc(100% + 4px); right:0; min-width:260px; max-height:240px; overflow-y:auto; background:var(--card); border:1px solid var(--border); border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.12); z-index:500; }
    .pos-dd-item { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; cursor:pointer; font-size:12px; gap:8px; }
    .pos-dd-item:hover { background:var(--subtle); }
    .pos-dd-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pos-dd-id { font-size:11px; color:var(--muted); flex-shrink:0; direction:ltr; }
    .pos-dd-empty { padding:12px; text-align:center; font-size:12px; color:var(--muted); }
    /* filter bar divider */
    .fbar-div { width:1px; height:20px; background:var(--border); flex-shrink:0; }
    /* compact filter selects */
    .fsel { font-family:inherit; font-size:11px; background:var(--subtle); border:1px solid var(--border); border-radius:5px; padding:4px 6px; color:var(--text); direction:rtl; cursor:pointer; }
    /* chart wrapper for tooltip positioning */
    .chart-wrap { position:relative; overflow:visible; }
    /* ── Tabs ── */
    .tab-bar{display:flex;border-bottom:2px solid var(--border);background:var(--card);padding:0 24px;position:sticky;top:64px;z-index:150;}
    @media(max-width:640px){.tab-bar{top:56px;padding:0 14px;}}
    .tab-btn{font-family:inherit;font-size:13px;font-weight:600;padding:11px 18px;background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);cursor:pointer;margin-bottom:-2px;transition:color .15s,border-color .15s;}
    .tab-btn.active{color:var(--text);border-bottom-color:var(--accent);}
    /* filter-bar sits directly below header */
    .filter-bar{top:64px!important;}
    @media(max-width:640px){.filter-bar{top:56px!important;}}
    .cmp-section{background:var(--subtle);border-top:2px solid var(--border);}
    /* ── Comparison panel ── */
    .cmp-panel{padding:24px 24px 64px;}
    .cmp-pub-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;min-height:32px;}
    .cmp-chip{display:inline-flex;align-items:center;gap:6px;background:var(--subtle);border:1px solid var(--border);border-radius:20px;padding:4px 10px 4px 8px;font-size:12px;}
    .cmp-chip.own{border-color:var(--accent);background:rgba(254,208,73,0.12);}
    .cmp-chip-x{background:none;border:none;cursor:pointer;font-size:14px;line-height:1;padding:0 2px;color:var(--muted);}
    .cmp-chip-x:hover{color:var(--text);}
    .cmp-search-row{position:relative;margin-bottom:24px;display:flex;align-items:center;gap:10px;}
    .cmp-inp{font-family:inherit;font-size:12px;background:var(--subtle);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text);direction:rtl;width:260px;outline:none;}
    .cmp-inp:focus{border-color:var(--accent);}
    .cmp-hint{font-size:12px;color:var(--muted);}
    .cmp-dd{position:absolute;top:calc(100% + 4px);right:0;min-width:280px;max-height:220px;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:500;display:none;}
    .cmp-dd-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;cursor:pointer;font-size:12px;gap:8px;}
    .cmp-dd-item:hover{background:var(--subtle);}
    .cmp-dd-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .cmp-dd-id{font-size:10px;color:var(--muted);font-family:monospace;direction:ltr;flex-shrink:0;}
    /* group + comparison tables */
    .grp-tbl,.cmp-tbl{width:100%;border-collapse:collapse;font-size:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:0;}
    .grp-tbl th,.cmp-tbl th{padding:10px 12px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;border-bottom:2px solid var(--border);background:var(--subtle);white-space:nowrap;text-align:right;}
    .grp-tbl td,.cmp-tbl td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
    .grp-tbl tbody tr:last-child td,.cmp-tbl tbody tr:last-child td{border-bottom:none;}
    .grp-td{font-weight:600;white-space:nowrap;}
    .grp-sub-td{font-size:10px;color:var(--muted);white-space:nowrap;}
    .grp-td-hdr{text-align:right;vertical-align:middle;font-weight:700;}
    .metric-hdr{text-align:center!important;background:rgba(254,208,73,0.06);border-right:1px solid var(--border);}
    .pub-sub-hdr{text-align:center;font-size:10px;font-weight:500;color:var(--muted);max-width:90px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid rgba(0,0,0,.05);}
    .pub-col-id{display:block;font-size:10px;color:var(--muted);font-family:monospace;font-weight:normal;}
    .val-td{text-align:right;font-variant-numeric:tabular-nums;}
    .val-td-c{text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);}
    .na-td{text-align:center;color:var(--border);}
    .spark-td{padding:4px 8px;vertical-align:middle;line-height:0;}
    .pos-desc-td{font-size:12px;max-width:220px;}
    .trend-up{color:#22c55e;font-weight:600;}
    .trend-dn{color:#ef4444;font-weight:600;}
    /* comparison panel restructured */
    .cmp-pub-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
    .cmp-controls{display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--border);}
    .cmp-mode-sw{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;flex-shrink:0;}
    .cmp-mode-btn{font-family:inherit;font-size:12px;font-weight:600;background:none;border:none;padding:6px 14px;cursor:pointer;color:var(--muted);transition:background .15s,color .15s;}
    .cmp-mode-btn.active{background:var(--accent);color:#1c1917;}
    .cmp-date-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
    .cmp-desc-bar{display:flex;margin-bottom:14px;}
    .cmp-desc-inp{font-family:inherit;font-size:12px;background:var(--subtle);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text);direction:rtl;width:300px;outline:none;}
    .cmp-desc-inp:focus{border-color:var(--accent);}
    /* Date range picker */
    .drp-wrap{position:relative;flex-shrink:0;}
    .drp-btn{font-family:inherit;font-size:12px;background:var(--subtle);border:1px solid var(--border);border-radius:8px;padding:5px 10px;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:border-color .15s;}
    .drp-btn:hover,.drp-btn.open{border-color:var(--accent);background:var(--card);}
    .drp-cal{position:absolute;top:calc(100% + 6px);right:0;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.2);z-index:600;padding:14px 14px 10px;width:270px;}
    .drp-cal-hidden{display:none;}
    .drp-cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
    .drp-nav-btn{font-family:inherit;font-size:15px;background:none;border:1px solid var(--border);border-radius:7px;width:28px;height:28px;cursor:pointer;color:var(--text);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .1s;}
    .drp-nav-btn:hover{background:var(--subtle);}
    .drp-year-lbl{font-size:13px;font-weight:700;}
    .drp-dow-hdr{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10px;color:var(--muted);margin-bottom:4px;}
    .drp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px;}
    .drp-d-empty{height:30px;}
    .drp-d-btn{font-family:inherit;font-size:11px;background:none;border:1px solid transparent;border-radius:6px;height:30px;width:100%;cursor:pointer;color:var(--text);transition:background .1s;}
    .drp-d-btn:hover{background:var(--subtle);}
    .drp-d-btn.in-range{background:rgba(254,208,73,.18);}
    .drp-d-btn.selected{background:var(--accent);color:#1c1917;font-weight:700;}
    .drp-hint{font-size:11px;color:var(--muted);text-align:center;padding:6px 0 2px;border-top:1px solid var(--border);}
    .drp-reset-row{text-align:center;margin-top:4px;}
    .drp-reset-btn{font-family:inherit;font-size:11px;background:none;border:none;cursor:pointer;color:var(--muted);text-decoration:underline;}
    .drp-reset-btn:hover{color:var(--text);}
    /* Publisher comparison legend + total row */
    .cmp-legend{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;}
    .cmp-legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-left:4px;}
    .cmp-legend-lbl{color:var(--text);}
    .grp-total-row td{border-top:2px solid var(--border)!important;font-weight:700;background:var(--subtle);}
  </style>
</head>
<body>
<div id="loading"><div class="ld-logo">ن</div><p>در حال بارگذاری گزارش...</p></div>
<div id="root" style="display:none;"></div>
<script src="report-viewer.js"></script>
</body>
</html>
